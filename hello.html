<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="./popup.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
    crossorigin="anonymous"></script>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./popup.css" />
</head>

<body class="bg-secondary">
  <div class="row m-2 p-3 bg-dark text-white rounded-4">
    <div id="title" class="nice" style="font-size: 16px">0</div>
    <div class="description" id="description" style="font-size: 16px">
      tabs opened
    </div>
  </div>
  <div class="container pb-3">
    <div class="row g-2">
      <div class="col">
        <div class="feature-card bg-dark p-3 d-flex flex-column">
          <div>
            <p class="mb-1" style="font-size: 12px; font-weight: 1000; color: rgb(255, 255, 255);">Auto-left</p>
            <p style="font-size: 11px; color: rgb(255, 255, 255, 0.6);">Move your newly created tab to left side</p>
          </div>
          <div class="mt-auto">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" value="" id="checkNativeSwitch" switch>
            </div>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="feature-card bg-dark p-3 d-flex flex-column">
          <div>
            <p class="mb-1" style="font-size: 12px; font-weight: 1000; color: rgb(255, 255, 255);">Clear duplicated
              tabs</p>
            <p style="font-size: 11px; color: rgb(255, 255, 255, 0.8);">(except active tabs
              and media playing tabs)</p>
          </div>
          <div class="mt-auto">
            <button type="button" class="duplicate btn btn-secondary custom-text-color btn-sm">
              Clear
            </button>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="feature-card bg-dark p-3 d-flex flex-column">
          <div>
            <p class="mb-1" style="font-size: 12px; font-weight: 1000; color: rgb(255, 255, 255);">Sort tabs</p>
            <p style="font-size: 11px; color: rgba(255, 255, 255, 0.6);">Sort your tabs based on icons</p>
          </div>
          <div class="mt-auto">
            <button id="sortButton" type="button" class="btn btn-primary btn-sm">
              Sort
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  </div>
  <script src="./popup.js" type="module"></script>
</body>

</html>
